[package]
name = "hanzo-actions"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hanzoai/mcp"
description = "Kai Actions: typed, verified operations run without a model call. Kai selects an action and binds its inputs over the Decisions API; the action's verifier, not the model, says it is done. Light enough for Dev to link."

[dependencies]
regex = "1"
# The Decisions API is asked from a blocking thread; the tool runs the executor under spawn_blocking.
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
