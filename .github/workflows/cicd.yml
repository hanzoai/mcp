# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the hanzoai org runners on github.com, which read only .github/workflows.
name: CI/CD
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
